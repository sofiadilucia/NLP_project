name: nlp
channels:
  - pytorch
  - huggingface
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy=1.26
  - mkl=2024.0.0
  - pytorch::cpuonly
  - pytorch::pytorch=2.2.2
  - jupyter
  - ipykernel
  - pip
  - pip:
    - transformers==4.51.3
    - tokenizers==0.21.4
    - huggingface_hub==0.36.2
    - datasets
    - accelerate
    - fsspec[http]<=2026.2.0
    - langchain
    - langchain-community